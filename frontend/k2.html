<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trading View Widget</title>
    <style>
        /* Basic styling */
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
        }
        /* Button styling */
        .button-group {
            margin-top: 20px;
        }
        .btn {
            margin: 5px;
            padding: 10px 20px;
            font-size: 16px;
            color: #ffffff;
            background-color: #007bff;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        .btn:hover {
            background-color: #0056b3;
        }
        .back-btn {
            margin: 20px;
        }
        /* Widget container styling */
        .widget-container {
            width: 100%;
            max-width: 1000px;
            height: 600px;
            background-color: #fff;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        }
        /* Market data display */
        .market-data {
            margin-top: 20px;
            padding: 10px;
            background-color: #fff;
            border: 1px solid #ddd;
            border-radius: 5px;
            width: 300px;
            text-align: center;
        }
    </style>
</head>
<body>

    <!-- Back button -->
    <button class="btn back-btn" onclick="goBack()">Back</button>

    <!-- TradingView widget container -->
    <div class="tradingview-widget-container">
        <div id="tradingview_inf"></div>
        <script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
        <script type="text/javascript">
            new TradingView.widget({
                "container_id": "tradingview_inf",
                "symbol": "BSE:INFY",
                "interval": "D",
                "timezone": "exchange",
                "theme": "light",
                "style": "1",
                "locale": "en",
                "toolbar_bg": "#f1f3f6",
                "allow_symbol_change": false,
                "hide_side_toolbar": false,
                "studies": [],
                "show_popup_button": true,
                "popup_width": "1000",
                "popup_height": "650"
            });
        </script>
    </div>

    <!-- Market data display -->
    <div class="market-data" id="market-data">
        <h3>Market Data</h3>
        <p>Current Price: <span id="current-price">Loading...</span></p>
        <p>Volume: <span id="current-volume">Loading...</span></p>
    </div>

    <!-- Buy and Sell buttons -->
    <div class="button-group">
        <button class="btn" onclick="window.location.href='/buy'">Buy</button>
        <button class="btn" onclick="window.location.href='/sell'">Sell</button>
    </div>

    <script>
        // Go back to previous page
        function goBack() {
            window.history.back();
        }

        // Fetch market price and volume from your API
        async function fetchMarketData() {
            try {
                const response = await fetch('/api/market-data?symbol=BSE:INFY'); // Replace with your API endpoint
                if (!response.ok) {
                    throw new Error('Network response was not ok');
                }
                const data = await response.json();
                // Update the DOM with the fetched data
                document.getElementById('current-price').textContent = data.price || 'N/A';
                document.getElementById('current-volume').textContent = data.volume || 'N/A';
            } catch (error) {
                console.error('Error fetching market data:', error);
                document.getElementById('current-price').textContent = 'Error';
                document.getElementById('current-volume').textContent = 'Error';
            }
        }

        // Call the fetch function on page load
        document.addEventListener('DOMContentLoaded', fetchMarketData);
    </script>

</body>
</html>
