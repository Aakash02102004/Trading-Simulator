<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TradingView Chart Example</title>
    <style>
        #chart-container {
            width: 100%;
            height: 500px;
        }
    </style>
    <script src="path/to/charting_library.js"></script>
</head>
<body>
    <div id="chart-container"></div>
    <script>
        const widget = new TradingView.widget({
            container_id: "chart-container",
            width: "100%",
            height: "100%",
            symbol: "NASDAQ:AAPL",
            interval: "D",
            timezone: "Etc/UTC",
            theme: "light",
            style: "1",
            toolbar_bg: "#f1f3f6",
            withdateranges: true,
            allow_symbol_change: true,
            details: true,
            hotlist: true,
            calendar: true,
            studies: ["MACD@tv-basicstudies"],
            locale: "en"
        });
    </script>
</body>
</html>
