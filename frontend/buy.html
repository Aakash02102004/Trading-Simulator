<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buy Stock</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
        }
        .buy-form-container {
            width: 100%;
            max-width: 500px;
            padding: 20px;
            background-color: white;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            border-radius: 8px;
        }
        h2 {
            margin-bottom: 20px;
            text-align: center;
            color: #007bff;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input[type="text"],
        input[type="number"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 16px;
        }
        .btn {
            width: 100%;
            padding: 10px;
            font-size: 16px;
            color: #ffffff;
            background-color: #007bff;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 10px;
        }
        .btn:hover {
            background-color: #0056b3;
        }
        .status-message {
            text-align: center;
            margin-top: 10px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="buy-form-container">
        <h2>Buy Stock</h2>
        <form id="buy-form">
            <div class="form-group">
                <label for="symbol">Stock Symbol</label>
                <input type="text" id="symbol" name="symbol" required placeholder="Enter stock symbol (e.g., BSE:INFY)">
            </div>
            <div class="form-group">
                <label for="price">Price</label>
                <input type="number" id="price" name="price" required placeholder="Enter buy price" step="0.01">
            </div>
            <div class="form-group">
                <label for="quantity">Quantity</label>
                <input type="number" id="quantity" name="quantity" required placeholder="Enter quantity" min="1">
            </div>
            <button type="submit" class="btn">Place Buy Order</button>
        </form>
        <button id="watchlist" type="submit" class="btn btn-primary"><a href='/portfoliomain'> Portfolio </a></button>

        <div id="status" class="status-message"></div>
    </div>

    <script>
        document.getElementById('buy-form').addEventListener('submit', async (event) => {
            event.preventDefault();

            const symbol = document.getElementById('symbol').value;
            const price = parseFloat(document.getElementById('price').value);
            const quantity = parseInt(document.getElementById('quantity').value);

            try {
                const response = await fetch('/api/order/buy', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ userId: 'user1', symbol, price, quantity })
                });
                if (response.status === 401) {  // Unauthorized, possibly due to missing authentication
                    window.location.href = '/signin';
                    return;
                }

                if (!response.ok) {
                    throw new Error('Failed to place buy order. Please check your inputs or try again.');
                }

                const result = await response.json();
                document.getElementById('status').textContent = `Order placed successfully for ${result.quantity} shares of ${result.symbol} at Rs ${result.price} each.`;
                document.getElementById('status').style.color = 'green';

            } catch (error) {
                document.getElementById('status').textContent = error.message;
            document.getElementById('status').style.color = 'red';

            // Redirect to sign-in page in case of error (e.g., session timeout)
             // Redirect after 2 seconds to show the error message briefly
            }
        });
    </script>

</body>
</html>
